pack_name: ux
version: 1.1.0
purpose: Llevar User Stories validadas hasta un paquete de diseño consolidado (UXS), un diseño gobernado y un handoff DESIGN_READY_FOR_DEV, con trazabilidad US → UXR → FLW → SCR → UXS → DTM y compuertas humanas
# Estándar de referencia: comsatel-skill-pack-factory v1.2 (un orquestador y como máximo seis especialistas).
# ux-ui-orchestrator coordina 10 skills porque tiene que preparar toda la documentación de UX: requisitos, flujos,
# pantallas, catálogo atómico, consolidación del paquete (UXS), exploración, accesibilidad, diseño gobernado y handoff. Se acepta que supere los 6.
excepcion_especialistas: Preparar toda la documentación de UX exige estas 10 especialidades; el límite de 6 rige para el pack de desarrollo.
skills:
- name: ux-ui-orchestrator
  role: orchestrator
  description: Diagnostica, planifica por fases, enruta las preguntas entre skills, audita (incluido el control de cierre de paquete: sin UXS no se sube una rama de diseño) y delega la consolidación en ux-context-builder
- name: ux-requirements-analyzer
  role: specialist
  description: Convierte User Stories y reglas de negocio en requisitos UX (UXR) y preguntas abiertas
- name: user-flow-designer
  role: specialist
  description: Convierte los UXR en flujos (FLW) con camino feliz, excepciones, permisos y estados
- name: ui-spec-writer
  role: specialist
  description: Convierte un flujo en especificación de pantallas (SCR), componentes y tokens
- name: web-atomic-component-designer
  role: specialist
  description: Catálogo atómico Angular, opcional cuando hay librería de componentes
- name: ux-context-builder
  role: specialist
  description: Arma la UXS (UX Context Pack) de un paquete DSP-NNN con veredicto por consumidor, hallazgos y preguntas abiertas; cierra el paquete de diseño
- name: stitch-ui-generator
  role: specialist
  description: Genera la exploración visual en Google Stitch para pantallas ya especificadas
- name: claude-design-orchestrator
  role: specialist
  description: Explora y critica alternativas de diseño en Claude Design
- name: accessibility-reviewer
  role: specialist
  description: Evalúa una especificación, HTML o nodo contra WCAG 2.2 AA y registra hallazgos
- name: figma-design-validator
  role: specialist
  description: Valida el diseño en Figma y lo registra como diseño gobernado
- name: ux-development-handoff
  role: specialist
  description: Paquete de entrega a Desarrollo y puerta DESIGN_READY_FOR_DEV
# Entrada del pack: historias y reglas ya producidas por af-requirements-orchestrator (RQS con veredicto UX/UI READY o CONDITIONAL).
upstream:
- af-requirements-orchestrator
# Etapa siguiente, fuera del pack.
downstream:
- orquestador-desarrollo
gates:
- id: G0
  name: Diagnóstico y plan
  criteria:
  - Escenario clasificado y ruta mínima mostrada antes de ejecutar
  - Si escribe archivos, trabaja en un worktree ux/<slug>
- id: G1
  name: Requisitos UX
  criteria:
  - Cada UXR con lineage a US y AC
  - Actor, permisos y estados; los vacíos quedan como preguntas
- id: G2
  name: Flujos
  criteria:
  - Camino feliz, excepciones, permisos y estados
  - screens declarado
- id: G3
  name: Especificación
  criteria:
  - El preflight del handoff sin BLOCKED
  - Cada SCR con flow, requirements, required_states y a11y_requirements
- id: GU
  name: Consolidación del paquete (UXS)
  criteria:
  - Todo paquete DSP-NNN con pantallas especificadas tiene una UXS que lo indexa (audit_ux.py --exigir-uxs sin PAQUETE_SIN_UXS)
  - La UXS trae el veredicto por consumidor con su razón, las preguntas abiertas con su responsable y la validación humana pendiente
  - Sin UXS no se sube una rama de diseño ux/*; el hook guardia-uxs lo frena y la compuerta se cumple también en la vía directa a front end
- id: G4
  name: Exploración
  criteria:
  - Cada artefacto con SCR → FLW
  - Claude Design, con Intent Brief y DD humano; o Stitch, con register-exploration sin error y un solo STP por iniciativa
- id: G5
  name: Accesibilidad
  criteria:
  - La accesibilidad se apoya en los componentes del Design System (el contrato de accesibilidad de cada componente); ARP por SCR cuando el diseño no sale de esos componentes
  - Lo propio de cada pantalla (orden de foco, mensajes, nombres accesibles) se verifica al validar lo construido; ningún pass sin evaluar; fail e inconclusive visibles
- id: G6
  name: Diseño gobernado
  criteria:
  - El diseño se gobierna en Claude Design (con DD humano) o con el prototipo en código validado al terminar de construir; el validador del handoff aún no reconoce el prototipo y se registra como decisión
  - Con Stitch o Figma, governed_design por SCR y divergencia Stitch ↔ Figma en none o resolved, con DD humano
- id: G7
  name: Handoff
  criteria:
  - El gate del handoff sin FAILED ni BLOCKED
  - Revisión humana pendiente registrada
tasks:
- id: T-01
  skill: ux-requirements-analyzer
  depends_on: []
  gate: G1
  outputs:
  - UXR y preguntas abiertas
- id: T-02
  skill: user-flow-designer
  depends_on:
  - T-01
  gate: G2
  outputs:
  - FLW
- id: T-03
  skill: ui-spec-writer
  depends_on:
  - T-02
  gate: G3
  outputs:
  - SCR, CMP y TKN
- id: T-03b
  skill: ux-context-builder
  depends_on:
  - T-03
  gate: GU
  outputs:
  - UXS con el veredicto por consumidor (el UX Context Pack que lee Claude Design, QA y Desarrollo)
# Vía directa a front end: tras GU, orquestador-desarrollo construye desde los SCR, el Design System y las decisiones; el diseño se gobierna con
# el prototipo validado al terminar de construir (G6). Esa vía también pasa por GU: la UXS se arma aunque no haya exploración.
- id: T-04
  skill: stitch-ui-generator
  depends_on:
  - T-03b
  gate: G4
  condition: la exploración se hace en Stitch
  outputs:
  - GEN y STP
- id: T-05
  skill: claude-design-orchestrator
  depends_on:
  - T-03b
  gate: G4
  condition: la exploración se hace en Claude Design
  outputs:
  - Intent Brief, alternativas y DD
- id: T-06
  skill: accessibility-reviewer
  depends_on:
  - T-04
  - T-05
  gate: G5
  condition: el diseño no sale de los componentes del Design System
  outputs:
  - ARP
- id: T-07
  skill: figma-design-validator
  depends_on:
  - T-06
  gate: G6
  condition: el diseño se gobierna en Figma
  outputs:
  - governed_design en el DTM
- id: T-08
  skill: ux-development-handoff
  depends_on:
  - T-07
  gate: G7
  condition: hay diseño gobernado registrado en el DTM (Figma o Stitch)
  outputs:
  - HOF y gate DESIGN_READY_FOR_DEV
# Decisiones y acciones que ningún skill toma por una persona.
human_only:
- Aprobar un diseño, asignar verified o approved, o registrar una validación en nombre de alguien
- Elegir entre alternativas de diseño
- Decidir, flujo por flujo, cómo se gobierna el diseño: explorando en Claude Design o con el prototipo en código validado al terminar de construir
- Resolver una divergencia Stitch ↔ Figma y aprobar el diseño gobernado
- Aprobar el gate DESIGN_READY_FOR_DEV
- Crear un proyecto Stitch (exige autorización explícita)
# Cada skill con evals/evals.json; npm test lo exige.
evals:
- ux-context-builder
